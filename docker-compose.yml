services:
  # 1. Base de Datos PostgreSQL de Producción
  db:
    image: postgres:15-alpine
    container_name: cybershield_db
    restart: always
    environment:
      POSTGRES_USER: cybershield_user
      POSTGRES_PASSWORD: cybershield_secure_pass
      POSTGRES_DB: cybershield_pyme
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybershield_user -d cybershield_pyme"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Servidor Backend FastAPI + Conv1D + Frontend
  api:
    build: .
    container_name: cybershield_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg2://cybershield_user:cybershield_secure_pass@db:5432/cybershield_pyme
      - SENSOR_API_KEY=${SENSOR_API_KEY:-CyberShield_Pyme_SecureToken_2026}
      - ENABLE_SIMULATION=${ENABLE_SIMULATION:-false}
      - RETENTION_DAYS=${RETENTION_DAYS:-30}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 3. Sensor NIDS Perimetral en Vivo (Activar en host Linux para captura real 24/7)
  # Para iniciar junto con el API: docker compose --profile with-sensor up -d
  sensor:
    build: .
    container_name: cybershield_sensor
    restart: always
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      api:
        condition: service_healthy
    environment:
      - API_BATCH_URL=http://127.0.0.1:8000/api/predict/batch
      - SENSOR_API_KEY=${SENSOR_API_KEY:-CyberShield_Pyme_SecureToken_2026}
      - SNIFF_IFACE=${SNIFF_IFACE:-eth0}
    command: ["python", "-m", "sensor.live_traffic_sniffer"]
    profiles:
      - with-sensor

volumes:
  postgres_data:
    driver: local