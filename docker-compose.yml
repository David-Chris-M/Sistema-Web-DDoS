version: '3.8'

services:
  # 1. Base de Datos PostgreSQL de Producción
  db:
    image: postgres:15-alpine
    container_name: cybershield_db
    restart: always
    environment:
      POSTGRES_USER: cybershield_user
      POSTGRES_PASSWORD: cybershield_secure_pass
      POSTGRES_DB: cybershield_pyme
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybershield_user -d cybershield_pyme"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Servidor Backend FastAPI + Conv1D + Frontend
  api:
    build: .
    container_name: cybershield_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://cybershield_user:cybershield_secure_pass@db:5432/cybershield_pyme
    ports:
      - "8000:8000"

volumes:
  postgres_data:
    driver: local