<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>CyberShield Pyme - Acceso Seguro NIDS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #1e293b 0%, #0f172a 65%, #020617 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
            margin: 0;
            padding: 16px;
        }
        .tarjeta-acceso {
            width: 100%;
            max-width: 430px;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 18px;
            padding: 36px 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65);
        }
        .icono-marca {
            width: 58px;
            height: 58px;
            border-radius: 14px;
            background: rgba(56, 189, 248, 0.14);
            border: 1px solid rgba(56, 189, 248, 0.35);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.85rem;
            color: #38bdf8;
            margin-bottom: 14px;
        }
        .form-control {
            background-color: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(148, 163, 184, 0.28);
            color: #f8fafc;
            padding: 11px 14px;
            font-size: 0.94rem;
        }
        .form-control:focus {
            background-color: rgba(15, 23, 42, 0.95);
            border-color: #38bdf8;
            color: #ffffff;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }
        .form-control::placeholder {
            color: #64748b;
        }
        .input-group-text {
            background-color: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(148, 163, 184, 0.28);
            color: #94a3b8;
        }
        .boton-acceso {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            border: none;
            padding: 11px 16px;
            font-weight: 600;
            border-radius: 10px;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
        }
        .boton-acceso:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.5);
        }
        .insignia-seguridad {
            font-size: 0.76rem;
            color: #94a3b8;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.16);
            border-radius: 8px;
            padding: 8px 12px;
        }
    </style>
</head>
<body>
    <div class="tarjeta-acceso">
        <div class="text-center mb-4">
            <div class="icono-marca">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h4 class="fw-bold mb-1">CyberShield Pyme</h4>
            <p class="text-secondary small mb-0">Consola de Monitoreo NIDS Conv1D • Acceso Restringido</p>
        </div>

        <div id="alertaAcceso" class="alert alert-danger py-2 px-3 small d-none" role="alert">
            <i class="bi bi-exclamation-octagon-fill me-1"></i>
            <span id="textoAlertaAcceso">Credenciales inválidas</span>
        </div>

        <form id="formularioAcceso" autocomplete="off">
            <div class="mb-3">
                <label for="campoUsuario" class="form-label small fw-semibold text-light">Usuario Administrador</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                    <input type="text" class="form-control" id="campoUsuario" placeholder="Ej: admin" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label for="campoClave" class="form-label small fw-semibold text-light">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
                    <input type="password" class="form-control" id="campoClave" placeholder="••••••••••••" required>
                    <button class="btn btn-outline-secondary" type="button" id="botonAlternarClave" title="Mostrar/Ocultar">
                        <i class="bi bi-eye" id="iconoAlternarClave"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary boton-acceso w-100 text-white mb-3" id="botonEnviarAcceso">
                <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión Segura
            </button>
        </form>

        <div class="insignia-seguridad d-flex align-items-center justify-content-between mt-2">
            <span><i class="bi bi-cookie text-info me-1"></i> Sesión HttpOnly + HMAC-SHA256</span>
            <span><i class="bi bi-shield-check text-success me-1"></i> Ley N° 29733</span>
        </div>
    </div>

    <script>
        (function () {
            'use strict';
            const formulario = document.getElementById('formularioAcceso');
            const cajaAlerta = document.getElementById('alertaAcceso');
            const textoAlerta = document.getElementById('textoAlertaAcceso');
            const botonEnviar = document.getElementById('botonEnviarAcceso');
            const botonAlternarClave = document.getElementById('botonAlternarClave');
            const iconoAlternarClave = document.getElementById('iconoAlternarClave');
            const entradaUsuario = document.getElementById('campoUsuario');
            const entradaClave = document.getElementById('campoClave');

            botonAlternarClave.addEventListener('click', () => {
                const esOculta = entradaClave.type === 'password';
                entradaClave.type = esOculta ? 'text' : 'password';
                iconoAlternarClave.className = esOculta ? 'bi bi-eye-slash' : 'bi bi-eye';
            });

            formulario.addEventListener('submit', async (evento) => {
                evento.preventDefault();
                cajaAlerta.classList.add('d-none');
                botonEnviar.disabled = true;
                botonEnviar.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Verificando...';

                try {
                    const respuesta = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            usuario: entradaUsuario.value.trim(),
                            contrasena: entradaClave.value
                        })
                    });

                    if (respuesta.ok) {
                        window.location.href = '/frontend/';
                        return;
                    }

                    const datos = await respuesta.json().catch(() => ({}));
                    textoAlerta.textContent = datos.detail || 'Error de autenticación';
                    cajaAlerta.classList.remove('d-none');
                } catch (error) {
                    textoAlerta.textContent = 'No se pudo conectar con el servidor NIDS.';
                    cajaAlerta.classList.remove('d-none');
                } finally {
                    botonEnviar.disabled = false;
                    botonEnviar.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión Segura';
                }
            });
        })();
    </script>
</body>
</html>
